        .page { display: none; padding-bottom: 90px; min-height: 100vh; animation: fadeIn 0.4s ease; background: #fff; }
        .active-page { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .header { display: flex; justify-content: center; align-items: center; padding: 18px; background: #fff; border-bottom: 1px solid #ffe3e9; position: sticky; top: 0; z-index: 100; }

        @keyframes float { 0% { transform: translateY(110vh) scale(0); opacity: 1; } 100% { transform: translateY(-10vh) scale(1.5); opacity: 0; } }

        /* Search & Banner */
        .search-area { padding: 10px 15px; }
        .search-box { display: flex; align-items: center; background: #fdf2f5; padding: 10px 15px; border-radius: 50px; border: 1px solid #ffccd5; }
        .search-box input { border: none; background: none; outline: none; width: 100%; margin-left: 10px; }
        .quote-banner { background: linear-gradient(45deg, var(--primary), var(--secondary)); margin: 10px 15px; padding: 12px; border-radius: 15px; color: #fff; text-align: center; font-size: 13px; font-style: italic; }

        /* Profile Cards */
        .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .p-card { background: #fff; border-radius: 15px; overflow: hidden; border: 1px solid #ffccd5; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        .info-table td:first-child { font-weight: bold; color: var(--secondary); width: 40%; }
        
        /* Green Calling Button */
        .btn-call { background: var(--calling-color) !important; color: #fff; border: none; padding: 15px; border-radius: 50px; width: 100%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; text-decoration: none; margin-top: 20px; box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4); }

        .video-card { background: #fff; border: 1px solid #eee; border-radius: 15px; padding: 10px; margin: 15px; }

        .video-thumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        .video-thumb i { position: absolute; font-size: 50px; color: #fff; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 450px; background: #fff; display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid #eee; z-index: 1000; }

        .nav-link i { font-size: 22px; display: block; margin-bottom: 3px; }

    <!-- ৩. আবেদন পেজ (CV Form - টেলিগ্রাম ইন্টিগ্রেশন) -->

        <label style="font-weight:bold; font-size:13px;">আপনার পাসপোর্ট ছবি আপলোড করুন:</label>

        <input type="text" id="cv-name" placeholder="আপনার পূর্ণ নাম">
        <input type="number" id="cv-age" placeholder="আপনার বয়স">

        <textarea id="cv-bio" placeholder="নিজের সম্পর্কে বিস্তারিত কিছু লিখুন..."></textarea>
        
        <button class="btn-action" onclick="submitFullCVWithPhoto()">আবেদন সাবমিট করুন</button>
    </div>

    <!-- সাব পেজসমূহ -->

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <div class="nav-link active" id="btn-home" onclick="navigateTo('home-page')"><i class="fa fa-home"></i>হোম</div>
        <div class="nav-link" id="btn-video" onclick="navigateTo('video-page')"><i class="fa fa-play-circle"></i>ভিডিও</div>
        <div class="nav-link" id="btn-abedon" onclick="navigateTo('abedon-page')"><i class="fa fa-file-signature"></i>আবেদন</div>
        <div class="nav-link" onclick="window.location.href='https://t.me/ratertara_bot?start=_tgr_eRkM795jY2M1'"><i class="fab fa-telegram-plane"></i>সাপোর্ট</div>

<script>
    // Configuration (Telegram)
    const TG_BOT_TOKEN = "8551822175:AAEL_HRPcoecnQ-bAxudV13D-sA2_IOkjkU";
    const TG_CHAT_ID = "-1003119670905";

    const girls = [
        { id: 1, name: "কবিতা", age: 25, loc: "গাজীপুর", v: "***", t: "হাতীবান্ধা", d: "রংপুর", bio: "আসসালামু আলাইকুম আমি কবিতা। যদি কোনো ব্যক্তি আমাকে বিয়ে করতে চান,আমার একটি ছোট্ট মেয়ে সন্তান আছে বয়স বছর। যিনি আমাকে ভালোবাসার পাশাপাশি আমার সন্তানটির দায়িত্বও নিজের মনে করে নিতে পারবেন, শুধুমাত্র তারাই যোগাযোগ করবেন।", img: "https://blogger.googleusercontent.com/img/a/AVvXsEhyRPqyBvVfb_X8Mc-Ega2acRDvQroH3q8Rm_03K7zZVnutNMam3MKm8lib2AA2ZK34Yxy-bk8gOeP4tNRTiOrnyIiPy519F6hoQMUGctoaOuslceK2M06j2OE9myHrvK6hRVdrhQi-ERNQSVOpc8Qn9mT4-IVB9IctsiVelS--vJC5lWYtuskee_h_vrfZ=s1600" },
      
    ];

    const videoData = [
        { id: 1, title: "অ্যাপটি কিভাবে ব্যবহার করবেন", url: "fA8HshHwz5w" },
        { id: 2, title: "সঠিক বায়োডাটা দেওয়ার নিয়ম", url: "fA8HshHwz5w" }
    ];

    function navigateTo(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(id).classList.add('active-page');
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        if(id === 'home-page') document.getElementById('btn-home').classList.add('active');
        if(id === 'video-page') document.getElementById('btn-video').classList.add('active');
        if(id === 'abedon-page') document.getElementById('btn-abedon').classList.add('active');
        window.scrollTo(0,0);
    }

    function renderHomeGrid(data) {
        const grid = document.getElementById('profile-grid');
        grid.innerHTML = "";
        data.forEach(g => {
            grid.innerHTML += `<div class="p-card" onclick="openBio(${g.id})"><img src="${g.img}" class="p-img"><div style="padding:10px; text-align:center;"><b>${g.name}</b><br><small>${g.age} বছর | ${g.loc}</small></div></div>`;
        });
    }

    function searchProfiles() {
        const q = document.getElementById('search-input').value.toLowerCase();
        const f = girls.filter(g => g.name.toLowerCase().includes(q) || g.loc.toLowerCase().includes(q));
        renderHomeGrid(f);
    }

    function openBio(id) {
        const g = girls.find(x => x.id === id);
        document.getElementById('bio-detail-page').innerHTML = `
            <img src="${g.img}" class="bio-header-img">
            <div class="bio-body">
                <button onclick="navigateTo('home-page')" style="background:none; border:none; color:var(--primary); font-weight:bold; margin-bottom:15px;"><i class="fa fa-arrow-left"></i> ফিরে যান</button>
                <h2>${g.name}</h2>
                <table class="info-table">
                    <tr><td>গ্রাম</td><td>${g.v}</td></tr>
                    <tr><td>থানা</td><td>${g.t}</td></tr>
                    <tr><td>বিভাগ</td><td>${g.d}</td></tr>
                    <tr><td>বয়স</td><td>${g.age} বছর</td></tr>
                </table>
                <p style="margin-top:15px; color:#555; line-height:1.6;">${g.bio}</p>
                <!-- HubVerify Locker Link Added to Button -->
                <a href="https://hubverify.com/cl/?o=69ef38cda2275" class="btn-call"><i class="fa fa-phone"></i> সরাসরি কল দিন</a>
            </div>`;
        navigateTo('bio-detail-page');
    }

    function initVideos() {
        const list = document.getElementById('video-content');
        list.innerHTML = "";
        videoData.forEach(v => {
            list.innerHTML += `<div class="video-card">
                <div class="video-thumb" onclick="window.location.href='https://hubverify.com/cl/?o=69ef38cda2275'">
                    <img src="https://img.youtube.com/vi/${v.url}/0.jpg">
                    <i class="fa fa-play-circle"></i>
                </div>
                <h4 style="margin-top:10px;">${v.title}</h4>
            </div>`;
        });
    }

    /* --- আবেদন সাবমিট (টেলিগ্রাম গ্রুপে ছবিসহ তথ্য) --- */
    async function submitFullCVWithPhoto() {
        const fileInput = document.getElementById('cv-file'), name = document.getElementById('cv-name').value, phone = document.getElementById('cv-phone').value;
        if(!fileInput.files[0] || !name || !phone) return alert("ছবি, নাম এবং ফোন নম্বর দিন!");
        
        document.getElementById('loading').style.display = 'flex';
        const fd = new FormData();
        fd.append('chat_id', TG_CHAT_ID); fd.append('photo', fileInput.files[0]);
        fd.append('caption', `📝 নতুন বায়োডাটা আবেদন\n👤 নাম: ${name}\n📞 ফোন: ${phone}\n📜 বিস্তারিত: ${document.getElementById('cv-bio').value}`);
        fd.append('parse_mode', 'HTML');
        
        try {
            await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
            alert("সফলভাবে পাঠানো হয়েছে!"); navigateTo('home-page');
        } catch (e) { alert("ব্যর্থ হয়েছে।"); } finally { document.getElementById('loading').style.display = 'none'; }
    }

    function createHearts() {
        const b = document.getElementById('heart-box');
        for(let i=0; i<15; i++) {
            let h = document.createElement('div'); h.className = 'heart'; h.innerHTML = '❤';
            h.style.left = Math.random()*100+'vw'; h.style.animationDelay = Math.random()*8+'s'; h.style.fontSize = Math.random()*15+15+'px';
            b.appendChild(h);
        }
    }

    // Start App
    initVideos();
    createHearts();
    renderHomeGrid(girls);
</script>
</body>
